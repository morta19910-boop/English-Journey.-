<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Journey</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f5f2;font-family:Arial;color:#173d35}
header{background:#173d35;color:white;padding:25px;text-align:center}
main{background:white;margin:15px;padding:20px;border-radius:15px}
button{width:100%;padding:15px;margin:6px 0;background:#198754;color:white;border:0;border-radius:10px;font-size:16px}
button:disabled{background:#999}
p{line-height:1.9}
.en{direction:ltr;text-align:left;font-size:19px}
progress{width:100%}
</style>
</head>
<body>
<header><h1>English Journey</h1><h2>رحلة الإنجليزية</h2><p>تعلم الإنجليزية قصة بعد قصة</p></header>
<main id="app"></main>
<script>
const stories=[
{
title:"The Lost Wallet",
ar:"المحفظة المفقودة",
text:"One morning, Adam was walking to school when he noticed a brown wallet lying beside the road. He opened it and found a large amount of money and an identity card. His family was poor, and he needed new shoes for school. For a moment, he thought about keeping the money. However, he remembered his father's advice that honesty was more valuable than gold. After school, Adam visited the address written on the card. An elderly man opened the door and looked surprised. He explained that the money was needed to buy medicine for his sick wife. Adam returned the wallet without asking for anything. The man thanked him with tears in his eyes. Adam walked home feeling richer than ever, although his pockets were empty.",
tr:"في صباح أحد الأيام كان آدم يسير إلى المدرسة عندما لاحظ محفظة بنية بجانب الطريق. فتحها فوجد مبلغاً كبيراً من المال وبطاقة هوية. كانت أسرته فقيرة وكان يحتاج إلى حذاء جديد للمدرسة. فكر للحظة في الاحتفاظ بالمال، لكنه تذكر نصيحة والده بأن الأمانة أغلى من الذهب. بعد المدرسة ذهب إلى العنوان المكتوب على البطاقة. فتح رجل مسن الباب وبدا متفاجئاً. أوضح أن المال كان ضرورياً لشراء الدواء لزوجته المريضة. أعاد آدم المحفظة دون أن يطلب شيئاً. شكره الرجل والدموع في عينيه. عاد آدم إلى المنزل شاعراً بأنه أغنى من أي وقت مضى رغم أن جيوبه كانت فارغة.",
words:["Wallet — محفظة","Honesty — الأمانة","Elderly — مسن","Medicine — دواء","Valuable — ثمين"],
q:[["What did Adam find?","A wallet","A phone","A book"],["Where was Adam going?","To school","To hospital","To the market"],["What did Adam need?","New shoes","A watch","A bicycle"],["Why did the man need money?","To buy medicine","To travel","To buy a car"],["What is the lesson?","Honesty","Revenge","Laziness"]]
},
{
title:"The Light in the Storm",
ar:"النور وسط العاصفة",
text:"It was a dark evening when a powerful storm reached a small village. Heavy rain covered the streets, and the electricity suddenly stopped. Sara was sitting with her family when she heard someone calling for help outside. She looked through the window and saw an old woman standing near a flooded road. Everyone was afraid to leave their homes. Sara asked her father to help, and together they called the local rescue team. While waiting, they used a flashlight to guide the woman toward a safe place away from the water. Soon, the rescuers arrived and brought her to safety. The next morning, the woman visited Sara's family to thank them. Sara understood that courage did not mean ignoring danger. It meant making wise decisions and helping others even when you were afraid.",
tr:"كانت ليلة مظلمة عندما وصلت عاصفة قوية إلى قرية صغيرة. غطت الأمطار الغزيرة الشوارع وانقطعت الكهرباء فجأة. كانت سارة تجلس مع أسرتها عندما سمعت شخصاً يستغيث بالخارج. نظرت من النافذة فرأت امرأة مسنة قرب طريق غمرته المياه. كان الجميع يخشون مغادرة منازلهم. طلبت سارة المساعدة من والدها واتصلا بفريق الإنقاذ المحلي. وأثناء الانتظار استخدما مصباحاً يدوياً لإرشاد المرأة إلى مكان آمن بعيداً عن المياه. وصل المنقذون وأوصلوها إلى بر الأمان. وفي الصباح التالي زارت المرأة أسرة سارة لتشكرهم. أدركت سارة أن الشجاعة لا تعني تجاهل الخطر، بل اتخاذ قرارات حكيمة ومساعدة الآخرين حتى عندما تشعر بالخوف.",
words:["Storm — عاصفة","Rescue — إنقاذ","Courage — شجاعة","Flooded — مغمور بالمياه","Wise — حكيم"],
q:[["What reached the village?","A storm","A train","A ship"],["Who needed help?","An old woman","A teacher","A young boy"],["Who helped Sara?","Her father","Her brother","Her friend"],["What did they use?","A flashlight","A television","A computer"],["What did Sara learn?","Courage requires wisdom","Ignore danger","Never help others"]]
},
{
title:"The Boy Who Never Gave Up",
ar:"الفتى الذي لم يستسلم",
text:"Omar dreamed of becoming an engineer, but mathematics was his weakest subject. Whenever his teacher asked a difficult question, Omar remained silent because he was afraid of making mistakes. One day, he failed an important examination and decided to abandon his dream. His teacher noticed his sadness and told him about a scientist who had failed many times before achieving success. Omar decided to try again. Every evening, he studied for one hour, solved problems, and wrote down his mistakes. Whenever he could not understand something, he asked for help. Months passed, and his results slowly improved. At the end of the year, Omar received one of the highest marks in his class. He realized that success was not a gift reserved for talented people. It was the result of patience, practice, and determination.",
tr:"كان عمر يحلم بأن يصبح مهندساً، لكن الرياضيات كانت أضعف مواده. كلما طرح المعلم سؤالاً صعباً ظل عمر صامتاً خوفاً من ارتكاب الأخطاء. وفي أحد الأيام رسب في امتحان مهم وقرر التخلي عن حلمه. لاحظ معلمه حزنه وأخبره عن عالم فشل مرات عديدة قبل تحقيق النجاح. قرر عمر المحاولة مجدداً. كان يدرس ساعة كل مساء ويحل المسائل ويدون أخطاءه. وعندما لا يفهم شيئاً يطلب المساعدة. مرت الشهور وتحسنت نتائجه تدريجياً. وفي نهاية العام حصل على إحدى أعلى الدرجات في فصله. أدرك أن النجاح ليس هدية مخصصة للموهوبين، بل نتيجة الصبر والممارسة والإصرار.",
words:["Engineer — مهندس","Mistakes — أخطاء","Achieve — يحقق","Patience — الصبر","Determination — الإصرار"],
q:[["What was Omar's dream?","To become an engineer","To become a farmer","To become a singer"],["What was his weakest subject?","Mathematics","History","English"],["Who encouraged Omar?","His teacher","A driver","A doctor"],["How long did he study every evening?","One hour","Five hours","Ten minutes"],["What leads to success?","Patience and practice","Fear","Giving up"]]
}
];
const app=document.getElementById("app");
let unlocked=Number(localStorage.getItem("ej_long_progress")||0);
function button(label,fn,disabled=false){
const b=document.createElement("button");
b.textContent=label;b.onclick=fn;b.disabled=disabled;app.appendChild(b);
}
function home(){
app.innerHTML="<h2>مكتبة القصص</h2><p>القصص المكتملة: "+Math.min(unlocked,stories.length)+" من "+stories.length+"</p><progress value='"+unlocked+"' max='"+stories.length+"'></progress>";
stories.forEach((s,i)=>button((i>unlocked?"🔒 ":"📖 ")+s.title+" — "+s.ar,()=>read(i),i>unlocked));
window.scrollTo(0,0);
}
function read(i){
const s=stories[i];
app.innerHTML="<h2>"+s.title+"</h2><h3>"+s.ar+"</h3><p class='en'>"+s.text+"</p>";
button("إظهار أو إخفاء الترجمة",()=>document.getElementById("tr").hidden=!document.getElementById("tr").hidden);
const p=document.createElement("p");p.id="tr";p.hidden=true;p.textContent=s.tr;app.appendChild(p);
const h=document.createElement("h3");h.textContent="المفردات الجديدة";app.appendChild(h);
s.words.forEach(w=>{const p=document.createElement("p");p.textContent=w;app.appendChild(p)});
button("ابدأ الاختبار",()=>quiz(i,0,0));
button("العودة للمكتبة",home);
window.scrollTo(0,0);
}
function quiz(i,n,score){
const qs=stories[i].q;
if(n===qs.length){
const percent=Math.round(score/qs.length*100);
if(percent>=80){unlocked=Math.max(unlocked,i+1);localStorage.setItem("ej_long_progress",unlocked)}
app.innerHTML="<h2>نتيجة الاختبار</h2><h1>"+percent+"%</h1><p>"+(percent>=80?"أحسنت! لقد نجحت.":"حاول مرة أخرى. نسبة النجاح 80%.")+"</p>";
button("إعادة القراءة",()=>read(i));button("مكتبة القصص",home);return;
}
const q=qs[n];
app.innerHTML="<h3>السؤال "+(n+1)+" من "+qs.length+"</h3><p class='en'>"+q[0]+"</p>";
const answers=q.slice(1);
for(let j=answers.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[answers[j],answers[k]]=[answers[k],answers[j]]}
answers.forEach(a=>button(a,()=>quiz(i,n+1,score+Number(a===q[1]))));
window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
