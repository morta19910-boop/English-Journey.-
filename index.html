<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6ff;color:#192344;font-family:Arial}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;justify-content:space-between}section{background:linear-gradient(135deg,#242064,#7049e8);color:white;border-radius:28px;padding:30px;margin-bottom:24px}h1{font-size:38px;margin:10px 0}button{border:0;border-radius:14px;padding:14px;background:#e9e7ff;color:#35228c;font-weight:bold;font-size:16px;cursor:pointer;margin:5px}section button{background:#ffdc65}article{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #20205012}nav{position:fixed;bottom:0;background:white;width:100%;display:flex;justify-content:center;box-shadow:0 -3px 20px #0001}nav button{font-size:12px;padding:10px;margin:2px}main{padding-bottom:100px}.story{direction:ltr;font-size:21px;line-height:2.5}.word{position:relative;cursor:pointer}.word.active{background:#ffe78a}.tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#242064;color:white;padding:4px 9px;border-radius:8px;white-space:nowrap;font-size:14px;line-height:1.5;z-index:5}.cover{font-size:70px;text-align:center;background:linear-gradient(135deg,#d8d2ff,#b9f0e3);border-radius:18px;padding:20px}.option{display:block;width:100%;text-align:left}small{color:#64748b}</style><header><b>🌍 English Journey</b><b>⭐ <span id="xp">0</span> XP</b></header><main id="app"></main><nav><button onclick="home()">🏠 الرئيسية</button><button onclick="library()">📚 القصص</button><button onclick="quiz(0,0)">📝 القواعد</button><button onclick="quiz(1,0)">🎮 الألعاب</button><button onclick="progress()">🏆 تقدمي</button></nav><script>
const app=document.getElementById('app');let xp=Number(localStorage.ejxp||0),done=JSON.parse(localStorage.ejdone||'[]');function reward(n){xp+=n;localStorage.ejxp=xp;document.getElementById('xp').textContent=xp}reward(0);
const stories=[{title:'The Secret of the Forest',icon:'🌳',text:'One morning, Adam walked into a quiet forest near his village. He wanted to discover something new. The sun was shining through the trees, and the birds were singing happily. Suddenly, Adam heard a strange sound behind a large tree. He moved slowly and found a small bird with an injured wing. The bird could not fly. Adam carefully picked it up and carried it home. He gave it water and food every day. After two weeks, the bird became strong again. Adam returned to the forest and opened his hands. The bird flew into the blue sky. Adam smiled because he understood that kindness was more valuable than any treasure.',q:'What did Adam find?',a:['An injured bird','A golden box','A lost dog'],c:0},{title:'The Lost Treasure',icon:'🏝️',text:'Sara lived in a small town beside the sea. One afternoon, she discovered an old map inside a wooden box. The map showed a mysterious island and a large red cross. Sara decided to investigate the secret with her brother. They borrowed a small boat and travelled across the calm water. When they arrived, they followed a narrow path through the island. Suddenly, dark clouds appeared above them. They hurried towards a cave to escape the rain. Inside the cave, they found a beautiful wooden chest. However, it contained no gold or diamonds. Instead, there were letters describing their grandfather’s adventures. Sara realized that the greatest treasure was not money, but the memories and wisdom of the people we love.',q:'What was inside the chest?',a:['Gold','Letters','Diamonds'],c:1}];
const dict={one:'واحد',morning:'صباح',walked:'مشى',into:'إلى داخل',quiet:'هادئ',forest:'غابة',near:'قرب',his:'له',village:'قرية',he:'هو',wanted:'أراد',to:'إلى',discover:'يكتشف',something:'شيء',new:'جديد',the:'الـ',sun:'شمس',was:'كان',shining:'تشرق',through:'عبر',trees:'أشجار',and:'و',birds:'طيور',were:'كانت',singing:'تغني',happily:'بسعادة',suddenly:'فجأة',heard:'سمع',a:'أداة تنكير',strange:'غريب',sound:'صوت',behind:'خلف',large:'كبير',tree:'شجرة',moved:'تحرك',slowly:'ببطء',found:'وجد',small:'صغير',bird:'طائر',with:'مع',an:'أداة تنكير',injured:'مصاب',wing:'جناح',could:'استطاع',not:'لا',fly:'يطير',carefully:'بحذر',picked:'التقط',it:'إياه',up:'إلى أعلى',carried:'حمل',home:'المنزل',gave:'أعطى',water:'ماء',food:'طعام',every:'كل',day:'يوم',after:'بعد',two:'اثنان',weeks:'أسابيع',became:'أصبح',strong:'قوي',again:'مجدداً',returned:'عاد',opened:'فتح',hands:'يدين',flew:'طار',blue:'أزرق',sky:'سماء',smiled:'ابتسم',because:'لأن',understood:'فهم',that:'أن',kindness:'اللطف',more:'أكثر',valuable:'قيمة',than:'من',any:'أي',treasure:'كنز',lived:'عاشت',in:'في',town:'مدينة',beside:'بجانب',sea:'بحر',afternoon:'بعد الظهر',she:'هي',discovered:'اكتشفت',old:'قديم',map:'خريطة',inside:'داخل',wooden:'خشبي',box:'صندوق',showed:'أظهر',mysterious:'غامض',island:'جزيرة',red:'أحمر',cross:'علامة تقاطع',decided:'قررت',investigate:'تستكشف',secret:'سر',her:'لها',brother:'أخ',they:'هم',borrowed:'استعاروا',boat:'قارب',travelled:'سافروا',across:'عبر',calm:'هادئ',when:'عندما',arrived:'وصلوا',followed:'تبعوا',narrow:'ضيق',path:'طريق',dark:'داكن',clouds:'غيوم',appeared:'ظهرت',above:'فوق',them:'هم',hurried:'أسرعوا',towards:'نحو',cave:'كهف',escape:'يهرب',rain:'مطر',beautiful:'جميل',chest:'صندوق',however:'لكن',contained:'احتوى',no:'لا',gold:'ذهب',or:'أو',diamonds:'ألماس',instead:'بدلاً من ذلك',there:'هناك',letters:'رسائل',describing:'تصف',their:'لهم',grandfather:'جد',adventures:'مغامرات',realized:'أدركت',greatest:'أعظم',money:'مال',but:'لكن',memories:'ذكريات',wisdom:'حكمة',of:'من',people:'الناس',we:'نحن',love:'نحب',adam:'آدم',sara:'سارة'};
function home(){app.innerHTML='<section><small style="color:white">YOUR ENGLISH ADVENTURE</small><h1 dir="ltr">Explore. Learn. Grow.</h1><p>تعلم الإنجليزية بالقصص والمغامرات والتحديات اليومية</p><button onclick="library()">ابدأ رحلتك ←</button></section><article onclick="library()">📚 مكتبة القصص التفاعلية</article><article onclick="quiz(0,0)">📝 تحدي القواعد</article><article onclick="quiz(1,0)">🎮 لعبة المفردات</article>'}function library(){app.innerHTML='<h2>مكتبة القصص</h2>'+stories.map((s,i)=>`<article onclick="read(${i})"><div class="cover">${s.icon}</div><h3 dir="ltr">${s.title}</h3><small>${s.text.split(' ').length} كلمة • ${done.includes(i)?'مكتملة':'ابدأ القراءة'}</small></article>`).join('')}
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}}function read(i){let s=stories[i];app.innerHTML=`<button onclick="library()">رجوع</button><div class="cover">${s.icon}</div><h2 dir="ltr">${s.title}</h2><button onclick="speak(stories[${i}].text)">🔊 استمع للقصة</button><p>اضغط على أي كلمة لمعرفة معناها</p><article class="story">${s.text.split(' ').map(w=>`<span class="word" onclick="translateWord(this)">${w}</span>`).join(' ')}</article><article dir="ltr"><h3>${s.q}</h3>${s.a.map((a,j)=>`<button class="option" onclick="answerStory(${i},${j},this)">${a}</button>`).join('')}</article>`}function translateWord(el){document.querySelectorAll('.tip').forEach(t=>t.remove());document.querySelectorAll('.active').forEach(t=>t.classList.remove('active'));let w=el.textContent.toLowerCase().replace(/[^a-z]/g,'');let t=document.createElement('span');t.className='tip';t.textContent=dict[w]||dict[w.replace(/s$/,'')]||'ترجمة غير متاحة';el.classList.add('active');el.append(t);speak(w)}function answerStory(i,j,b){if(j===stories[i].c){b.style.background='#b8f3c9';if(!done.includes(i)){done.push(i);localStorage.ejdone=JSON.stringify(done);reward(20)}b.textContent+=' ✓'}else{b.style.background='#ffd1d1'}}
const questions=[[['She ___ to school every day.',['go','goes','going'],1],['They ___ playing now.',['is','am','are'],2],['I ___ a book yesterday.',['read','reads','reading'],0],['He has ___ apple.',['a','an','the'],1]],[['ما معنى Courage?',['شجاعة','خوف','حزن'],0],['ما معنى Treasure?',['طريق','كنز','سماء'],1],['اختر عكس Big',['Tall','Small','Long'],1],['ما معنى Wisdom?',['حكمة','ماء','غابة'],0]]];function quiz(k,i){if(i>=questions[k].length){app.innerHTML='<section><h1>🏆 أحسنت!</h1><p>أنهيت التحدي</p><button onclick="home()">الرئيسية</button></section>';return}let q=questions[k][i];app.innerHTML=`<h2>${k?'🎮 لعبة الكلمات':'📝 اختبار القواعد'}</h2><small>${i+1} / ${questions[k].length}</small><article><h2 dir="auto">${q[0]}</h2>${q[1].map((a,j)=>`<button class="option" onclick="check(${k},${i},${j},this)">${a}</button>`).join('')}<p id="feedback"></p><button id="next" hidden onclick="quiz(${k},${i+1})">التالي ←</button></article>`}function check(k,i,j,b){if(j===questions[k][i][2]){reward(10);b.style.background='#b8f3c9';document.getElementById('feedback').textContent='إجابة صحيحة! +10 XP';document.querySelectorAll('.option').forEach(x=>x.disabled=true);document.getElementById('next').hidden=false}else{b.style.background='#ffd1d1';document.getElementById('feedback').textContent='حاول مرة أخرى'}}function progress(){app.innerHTML=`<section><h1>🏆 ${xp} XP</h1><p>المستوى ${1+Math.floor(xp/100)}</p></section><article>القصص المكتملة: ${done.length} / ${stories.length}</article>`}home();</script></html>
